<section class="modulex-ekip-sahne-plani{{fbsinif}}" {{fbetiket}}>
  <div class="modulex-ekip-sahne-plani-ic">
    {{fbbas}}
    {{fbgovde}}
  </div>
</section>

<style>
  /* ekip-sahne-plani — Mekânsal yerleşim iskeleti: üyeler ızgara/liste yerine sahne planı üzerinde konumlanır (hesaplanmış yay koordinatları) ve ayrı bir künye ile karşılıklı vurgu kurar; ekip-organizasyon-semasi'nin hiyerarşi ağacından ve ekip-avukat-profil'in liste→detay panelinden farklı olarak ilişki «kim nerede duruyor». */
  .modulex-ekip-sahne-plani { box-sizing: border-box; width: 100%; padding: --bosluk-- 20px; background: --bg--; color: --text--; font-size: 1rem; line-height: 1.6; font-family: var(--mx-font-sans, inherit); overflow-wrap: break-word; }
  .modulex-ekip-sahne-plani *, .modulex-ekip-sahne-plani *::before, .modulex-ekip-sahne-plani *::after { box-sizing: border-box; }
  /* ham/css.css «* { font-size: 14px }» kalıtımı keser — modül içinde boyut üstten gelsin (ikon yazı tipi hariç) */
  .modulex-ekip-sahne-plani :where(*:not(.material-symbols-outlined)) { font-size: inherit; }
  /* aynı «*» kuralı font-weight 400 · line-height 1.2 · font-family de basar — modül içinde kalıtım */
  .modulex-ekip-sahne-plani :where(*:not(.material-symbols-outlined)) { font-weight: inherit; line-height: inherit; font-family: inherit; }
  .modulex-ekip-sahne-plani :where(h2, h3, h4, p, ul, ol, li, figure, blockquote, dl, dd) { margin: 0; }
  .modulex-ekip-sahne-plani :where(ul, ol) { padding: 0; list-style: none; }
  .modulex-ekip-sahne-plani img { display: block; max-width: 100%; }
  /* <img width height> öznitelik yüksekliği CSS aspect-ratio'yu ezer — sıfır özgüllükle auto (modül sınıfının height'ı yine kazanır) */
  :where(.modulex-ekip-sahne-plani) img { height: auto; }
  .modulex-ekip-sahne-plani [hidden] { display: none !important; }
  .modulex-ekip-sahne-plani :where(a, button, summary, [data-cevir]) { cursor: pointer; }
  .modulex-ekip-sahne-plani :where(a, button, summary, [tabindex]):focus-visible { outline: 3px solid --accent--; outline-offset: 3px; }
  .modulex-ekip-sahne-plani-ic { max-width: --max--; margin-inline: auto; }
  .modulex-ekip-sahne-plani-bas { display: grid; gap: 12px; margin-block-end: clamp(32px, 4vw, 52px); }
  .modulex-ekip-sahne-plani--bassiz .modulex-ekip-sahne-plani-bas { display: none; }
  .modulex-ekip-sahne-plani-ust { color: --accentInk--; font-size: 0.8rem; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; }
  .modulex-ekip-sahne-plani-baslik { font-family: var(--mx-font-heading, inherit); font-size: clamp(1.8rem, 3.4vw, 2.8rem); font-weight: 750; letter-spacing: -0.025em; line-height: 1.1; }
  .modulex-ekip-sahne-plani-metin { color: --muted--; font-size: 1.05rem; line-height: 1.7; }
  .modulex-ekip-sahne-plani-bas { max-width: 780px; margin-inline: auto; text-align: center; justify-items: center; }
  .modulex-ekip-sahne-plani-cta { display: flex; flex-wrap: wrap; gap: 12px; margin-block-start: 8px; }
  .modulex-ekip-sahne-plani-dugme { display: inline-flex; align-items: center; gap: 8px; min-height: 48px; padding: 12px 22px; border: 2px solid --accent--; border-radius: 999px; background: --accent--; color: --accentText--; font-weight: 700; text-decoration: none; transition: transform 0.25s ease, background 0.25s ease, color 0.25s ease; }
  .modulex-ekip-sahne-plani-dugme:hover { transform: translateY(-2px); }
  .modulex-ekip-sahne-plani-dugme--ikincil { background: transparent; color: --text--; border-color: --cizgi--; }
  .modulex-ekip-sahne-plani-dugme--ikincil:hover { border-color: --accent--; }
  .modulex-ekip-sahne-plani-dugme .material-symbols-outlined { font-size: 20px; }

  .modulex-ekip-sahne-plani-duzen { display: grid; grid-template-columns: minmax(0, 7fr) minmax(0, 5fr); gap: clamp(24px, 4vw, 56px); align-items: center; }
  .modulex-ekip-sahne-plani-plan { display: grid; gap: 14px; }
  .modulex-ekip-sahne-plani-sahne { position: relative; aspect-ratio: 2 / 1; border: 2px solid --cizgi--; border-block-end: 6px solid --accent--; border-radius: 50% 50% 0 0 / 100% 100% 0 0; background-color: --kartBg--; background-image: radial-gradient(ellipse at 50% 100%, color-mix(in srgb, --accent-- 34%, transparent), transparent 68%), repeating-linear-gradient(90deg, transparent 0 46px, color-mix(in srgb, --text-- 7%, transparent) 46px 48px); }
  .modulex-ekip-sahne-plani-nokta { --pin: 78px; position: absolute; z-index: 1; display: grid; inline-size: var(--pin); aspect-ratio: 1; margin-inline-start: calc(var(--pin) / -2); margin-block-end: calc(var(--pin) / -2); border-radius: 50%; color: inherit; text-decoration: none; transition: transform 0.3s cubic-bezier(0.2, 0.8, 0.2, 1); }
  .modulex-ekip-sahne-plani-nokta:hover, .modulex-ekip-sahne-plani-nokta.modulex-ekip-sahne-plani--isik { z-index: 2; transform: scale(1.14); }
  .modulex-ekip-sahne-plani-pfoto { grid-area: 1 / 1; inline-size: 100%; block-size: 100%; border: 3px solid --bg--; border-radius: 50%; object-fit: cover; font-size: 1.3rem; box-shadow: 0 0 0 2px --accent--; transition: filter 0.3s ease; }
  .modulex-ekip-sahne-plani--odak .modulex-ekip-sahne-plani-nokta:not(.modulex-ekip-sahne-plani--isik) .modulex-ekip-sahne-plani-pfoto { filter: grayscale(1) brightness(0.65); }
  .modulex-ekip-sahne-plani-pno { grid-area: 1 / 1; align-self: end; justify-self: end; display: grid; place-items: center; min-inline-size: 26px; block-size: 26px; padding-inline: 5px; border-radius: 999px; background-color: --accent--; color: --accentText--; font-size: 0.74rem; font-weight: 800; font-variant-numeric: tabular-nums; }
  .modulex-ekip-sahne-plani-seyirci { display: flex; align-items: center; justify-content: center; gap: 8px; color: --muted--; font-size: 0.8rem; font-weight: 700; letter-spacing: 0.18em; text-transform: uppercase; }
  .modulex-ekip-sahne-plani-kunyeler { display: grid; gap: 4px; }
  .modulex-ekip-sahne-plani-kunye { display: grid; grid-template-columns: auto minmax(0, 1fr); align-items: center; gap: 14px; padding: 10px 14px; border-inline-start: 3px solid transparent; border-radius: 12px; transition: background-color 0.25s ease, border-color 0.25s ease; }
  .modulex-ekip-sahne-plani-kunye.modulex-ekip-sahne-plani--isik, .modulex-ekip-sahne-plani-kunye:target { border-inline-start-color: --accent--; background-color: --kartBg--; }
  .modulex-ekip-sahne-plani-sira { display: grid; place-items: center; inline-size: 36px; block-size: 36px; border: 1.5px solid --accent--; border-radius: 50%; color: --accentInk--; font-size: 0.82rem; font-weight: 800; font-variant-numeric: tabular-nums; }
  .modulex-ekip-sahne-plani-kyazi { display: grid; gap: 0; }
  .modulex-ekip-sahne-plani-kyazi .modulex-ekip-sahne-plani-ad { font-size: 1.02rem; }
  .modulex-ekip-sahne-plani-kyazi .modulex-ekip-sahne-plani-unvan { font-size: 0.85rem; }
  .modulex-ekip-sahne-plani-enstr { display: inline-flex; align-items: center; gap: 6px; color: --muted--; font-size: 0.82rem; }
  .modulex-ekip-sahne-plani-eikon { color: --accentInk--; font-size: 17px; }
  @media (max-width: 1024px) {
    .modulex-ekip-sahne-plani-duzen { grid-template-columns: minmax(0, 1fr); }
    .modulex-ekip-sahne-plani-plan { inline-size: 100%; max-inline-size: 760px; margin-inline: auto; }
  }
  @media (max-width: 768px) {
    .modulex-ekip-sahne-plani-nokta { --pin: 44px; }
    .modulex-ekip-sahne-plani-pfoto { border-width: 2px; font-size: 0.8rem; }
    .modulex-ekip-sahne-plani-pno { min-inline-size: 20px; block-size: 20px; padding-inline: 3px; font-size: 0.62rem; }
    .modulex-ekip-sahne-plani-kunye { padding: 8px 10px; }
  }
  /* img width/height öznitelikleri CSS yüksekliği olur — aspect-ratio'nun çalışması için yükseklik auto (modül kuralı ezebilir) */
  :where(.modulex-ekip-sahne-plani) img { height: auto; }
  .modulex-ekip-sahne-plani-foto { min-width: 0; }
  .modulex-ekip-sahne-plani-bag { color: inherit; text-decoration: none; }
  .modulex-ekip-sahne-plani-bag:hover { text-decoration: underline; text-underline-offset: 4px; }
  .modulex-ekip-sahne-plani-harf { display: grid; place-items: center; background-color: --vurguBg--; color: --vurguText--; font-weight: 800; letter-spacing: 0.02em; }
  .modulex-ekip-sahne-plani-sosyal { display: flex; flex-wrap: wrap; gap: 8px; }
  .modulex-ekip-sahne-plani-slink { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-width: 40px; min-height: 40px; padding: 0 10px; border: 1px solid --cizgi--; border-radius: 999px; color: inherit; font-size: 0.88rem; text-decoration: none; transition: background-color 0.25s ease, color 0.25s ease, border-color 0.25s ease; }
  .modulex-ekip-sahne-plani-slink:hover { background-color: --accent--; border-color: --accent--; color: --accentText--; }
  .modulex-ekip-sahne-plani-slink .material-symbols-outlined { font-size: 19px; }
  .modulex-ekip-sahne-plani-syazi { overflow-wrap: anywhere; }
  .modulex-ekip-sahne-plani-ad { font-size: 1.12rem; font-weight: 750; line-height: 1.3; }
  .modulex-ekip-sahne-plani-unvan { color: --accentInk--; font-size: 0.92rem; font-weight: 650; }
  .modulex-ekip-sahne-plani-bio { color: --muted--; font-size: 0.95rem; line-height: 1.65; }
  .modulex-ekip-sahne-plani-bolum { color: --muted--; font-size: 0.78rem; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; }

  :is([lang="ar"], [lang="fa"], [lang="he"], [lang="ur"]) .modulex-ekip-sahne-plani :is(.modulex-ekip-sahne-plani-baslik, .modulex-ekip-sahne-plani-ust, h3, h4, strong) { letter-spacing: 0; }
  :is([lang="ar"], [lang="fa"], [lang="he"], [lang="ur"]) .modulex-ekip-sahne-plani-baslik { line-height: 1.35; }
  @media (max-width: 768px) {
    .modulex-ekip-sahne-plani { padding-inline: 16px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .modulex-ekip-sahne-plani *, .modulex-ekip-sahne-plani *::before, .modulex-ekip-sahne-plani *::after { animation: none !important; transition: none !important; }
  }
</style>
<script>
  (() => {
    const P = "modulex-ekip-sahne-plani";
    const az = !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
    const sahneEsle = (s, P, az) => {
        const E = [...s.querySelectorAll("[data-sp]")];
        if (!E.length) return;
        let sabit = null;
        const yak = (v) => {
          E.forEach((e) => e.classList.toggle(P + "--isik", v != null && e.dataset.sp === v));
          s.classList.toggle(P + "--odak", v != null);
        };
        E.forEach((e) => {
          e.addEventListener("pointerenter", () => yak(e.dataset.sp));
          e.addEventListener("pointerleave", () => yak(sabit));
          e.addEventListener("focusin", () => yak(e.dataset.sp));
          e.addEventListener("focusout", () => yak(sabit));
          if (e.tagName === "A") e.addEventListener("click", (x) => {
            x.preventDefault();
            sabit = sabit === e.dataset.sp ? null : e.dataset.sp;
            yak(sabit);
            const h = s.querySelector(`li[data-sp="${e.dataset.sp}"]`);
            if (h && sabit != null) h.scrollIntoView({ block: "nearest", behavior: az ? "auto" : "smooth" });
          });
        });
      };
    document.querySelectorAll("." + P).forEach((s) => {
      if (s.dataset.fbHazir) return;
      s.dataset.fbHazir = "1";
      sahneEsle(s, P, az);
    });
  })();
</script>
